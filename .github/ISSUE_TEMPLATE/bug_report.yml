name: Bug report
description: Report a reproducible issue with the app or notebook workflow.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, personal information, private data, or untrusted pickle attachments."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Redact secrets and private data.
    validations:
      required: false
